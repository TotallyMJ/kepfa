<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepfa</title>
<meta name="description" content="Keep the sky. Photograph the sky and keep it in a jar on your shelf.">
<meta name="theme-color" content="#F1EDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Reenie+Beanie&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <a href="#/" class="tab" data-tab="shelf">Shelf</a>
    <button class="keep-btn" id="openCapture" type="button" aria-label="Keep a sky">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
    </button>
    <a href="#/months" class="tab" data-tab="months">Months</a>
  </div>
</nav>

<section id="capture" class="capture" hidden aria-label="Keep a sky">
  <div class="cap-step cam" data-step="camera">
    <video id="camVideo" playsinline muted></video>
    <svg id="camFrame" class="cam-frame" aria-hidden="true"></svg>
    <div class="cam-fallback" id="camFallback" hidden>
      <div class="fallback-jar" id="fallbackJar"></div>
      <p class="cam-fallback-title">The camera can’t open here</p>
      <p>Take the photo with your camera app, or pick a sky from your library.</p>
      <label class="btn primary on-dark" for="fileCamera">Take a photo</label>
      <label class="btn on-dark" for="fileGallery">Choose from library</label>
    </div>
    <div class="cam-top">
      <button class="btn-text on-dark" type="button" data-close-capture>Cancel</button>
      <p class="cam-hint">Frame the sky in the jar</p>
      <span class="cam-spacer"></span>
    </div>
    <div class="cam-bottom">
      <label class="btn-text on-dark" for="fileGallery">Library</label>
      <button class="shutter" id="shutter" type="button" aria-label="Take photo"></button>
      <span class="cam-spacer"></span>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileGallery" accept="image/*" hidden>
  </div>
  <div class="cap-step review" data-step="review" hidden></div>
  <div class="cap-step drop" data-step="drop" hidden></div>
</section>

<div id="sheet" class="overlay" hidden>
  <div class="overlay-backdrop" data-close-sheet></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-label="Sky"></article>
</div>

<div id="storyModal" class="overlay" hidden>
  <div class="overlay-backdrop" data-close-story></div>
  <article class="sheet story-sheet" role="dialog" aria-modal="true" aria-label="Share to story"></article>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

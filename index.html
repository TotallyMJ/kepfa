<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Kepfa</title>
<meta name="description" content="Keep the sky. Photograph the sky and keep it in a jar on your shelf.">
<meta name="theme-color" content="#F1EDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kepfa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Reenie+Beanie&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="image" href="assets/paper.webp" type="image/webp">
<link rel="preload" as="image" href="assets/note.webp" type="image/webp">
<link rel="preload" as="image" href="assets/tape.webp" type="image/webp">
</head>
<body>
<div class="app">
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <a href="#/" class="tab" data-tab="shelf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Home</a>
    <button class="keep-btn" id="openCapture" type="button" aria-label="Keep a sky">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
    </button>
    <a href="#/jars" class="tab" data-tab="months"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8M7.5 6h9l.5 2v10.5a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8z"/><path d="M7 13c2-1 3.5 1 5 0s3-1 5 0"/></svg>Jars</a>
  </div>
</nav>

<section id="capture" class="capture" hidden aria-label="Keep a sky">
  <div class="cap-step cam" data-step="camera">
    <video id="camVideo" playsinline muted></video>
    <svg id="camFrame" class="cam-frame" aria-hidden="true"></svg>
    <div class="cam-fallback" id="camFallback" hidden>
      <div class="fallback-jar" id="fallbackJar"></div>
      <p class="cam-fallback-title">The camera can’t open here</p>
      <label class="btn primary on-dark" for="fileCamera">Take a photo</label>
      <label class="btn on-dark" for="fileLibrary">Choose from your photos</label>
    </div>
    <div class="cam-top">
      <button class="cam-icon" type="button" data-close-capture aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </div>
    <p class="cam-hint">Frame the sky in the jar</p>
    <p class="cam-tip" id="liveTip" hidden>Tap for a photo · hold for a Live sky</p>
    <div class="cam-bottom">
      <label class="cam-icon" for="fileLibrary" aria-label="From your photos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L20 17"/></svg></label>
      <button class="shutter" id="shutter" type="button" aria-label="Take photo, or hold for a Live sky"><svg class="shutter-ring" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="45"/><circle class="shutter-progress" cx="48" cy="48" r="45"/></svg></button>
      <span class="cam-spacer"><button class="cam-icon" id="camFlip" type="button" aria-label="Switch camera" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5A2.5 2.5 0 0 1 6.5 7h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M9 12.5a3 3 0 0 1 5.2-2M15 14.5a3 3 0 0 1-5.2 2"/><path d="M14.4 9v1.7h-1.7M9.6 18v-1.7h1.7"/></svg></button></span>
    </div>
  </div>
  <div class="cap-step frame" data-step="frame" hidden>
    <img id="frameImg" alt="">
    <svg id="frameMask" class="cam-frame" aria-hidden="true"></svg>
    <div class="cam-top">
      <button class="cam-icon" type="button" data-close-capture aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </div>
    <p class="cam-hint">Drag and pinch to fit the sky in the jar</p>
    <div class="frame-bottom">
      <div class="frame-actions">
        <button class="btn on-dark" type="button" id="frameAnother">Choose another</button>
        <button class="btn primary on-dark" type="button" id="frameUse">Use this</button>
      </div>
    </div>
  </div>
  <input type="file" id="fileLibrary" accept="image/*" hidden>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <div class="cap-step review" data-step="review" hidden></div>
  <div class="cap-step drop" data-step="drop" hidden></div>
</section>

<div id="sheet" class="viewer" hidden>
  <div class="viewer-backdrop"></div>
  <article class="viewer-body" role="dialog" aria-modal="true" aria-label="Sky"></article>
</div>

<section id="celebrate" class="celebrate" hidden aria-label="Challenge complete"></section>
<section id="letter" class="celebrate letter-page" hidden aria-label="A letter from the sky"></section>

<div id="installSheet" class="overlay" hidden>
  <div class="overlay-backdrop"></div>
  <article class="sheet install-sheet" role="dialog" aria-modal="true" aria-label="Add to Home Screen"></article>
</div>

<div id="safeSheet" class="overlay" hidden>
  <div class="overlay-backdrop"></div>
  <article class="sheet safe-sheet" role="dialog" aria-modal="true" aria-label="Keep your jar safe"></article>
</div>
<input type="file" id="safeFile" accept="application/json,.json" hidden>

<div id="storyModal" class="overlay" hidden>
  <div class="overlay-backdrop" data-close-story></div>
  <article class="sheet story-sheet" role="dialog" aria-modal="true" aria-label="Share to story"></article>
</div>

<button type="button" id="jarX" class="jar-x" aria-label="Delete this sky" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>

<div id="confirm" class="confirm" hidden>
  <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle"></h2>
    <p id="confirmBody"></p>
    <div class="confirm-actions">
      <button type="button" class="btn" id="confirmNo"></button>
      <button type="button" class="btn danger" id="confirmYes"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="js/vendor/matter.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
